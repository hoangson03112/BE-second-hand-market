name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# Push liên tiếp vào cùng một nhánh/PR: huỷ lần chạy cũ, chỉ giữ lần mới nhất.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Lint · Test · Boot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Khớp với Dockerfile (node:20-alpine) để CI xanh không đồng nghĩa
          # production đỏ.
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` chứ không phải `npm install`: cài đúng theo lock file và fail
      # nếu package.json lệch lock — đúng thứ CI cần phát hiện.
      - name: Cài dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Bắt lỗi cú pháp / require sai đường dẫn / import vòng — những thứ lint
      # không thấy nhưng làm sập server ngay khi khởi động.
      - name: Kiểm tra app khởi động được
        run: node -e "require('./src/app'); console.log('app.js load OK')"
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          JWT_ACCESS_SECRET: ci-access-secret-placeholder-0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-fedcba9876543210
          CLIENT_URL: http://localhost:3000

      - name: Kiểm tra audit bảo mật (chỉ cảnh báo)
        run: npm audit --omit=dev --audit-level=high || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t eco-market-backend:ci .
